name: Build NetPulse APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build release APK (real router mode)
        run: flutter build apk --release --dart-define=DEMO_MODE=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
