name: netpulse_router_manager
description: "NetPulse Router Manager — local home-router manager focused on internet usage tracking and Wi-Fi speed control."
publish_to: 'none'

version: 1.2.0+5

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI (Material 3 now ships as a package, Flutter >= 3.47)
  material_ui: ^1.1.0
  fl_chart: ^1.3.1
  intl: ^0.20.3

  # State management
  flutter_riverpod: ^3.5.0

  # Router networking (local LAN only)
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  encrypt: ^5.0.3        # AES/RSA for encrypted ZYXEL firmware login
  pointycastle: ^3.9.1

  # Storage
  flutter_secure_storage: ^11.2.0   # router credentials (Keystore-encrypted)
  shared_preferences: ^2.5.6        # usage ledger, quota, app settings

  # Router admin page fallback
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  workmanager: ^0.10.10
  flutter_local_notifications: ^23.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
